<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="application-name" content="CreativeHub" />
    <meta id="app-theme-color" name="theme-color" content="#F3F5F8" />
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CreativeHub" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="CreativeHub - quản lý workflow nội dung và video nội bộ." />
    <title>CreativeHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      try {
        if (localStorage.getItem('vo-theme') === 'dark') document.documentElement.classList.add('dark');
      } catch (_) {}
    </script>
    <style>
      .app-first-paint{position:fixed;inset:0;display:grid;place-items:center;background:#F3F5F8;color:#172033;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .app-first-paint__brand{display:grid;justify-items:center;gap:14px}
      .app-first-paint__logo{width:52px;height:52px;object-fit:contain}
      .app-first-paint__name{font-size:17px;font-weight:750;letter-spacing:-.02em}
      .app-first-paint__track{width:96px;height:3px;overflow:hidden;border-radius:999px;background:#E1E7F0}
      .app-first-paint__bar{display:block;width:42%;height:100%;border-radius:inherit;background:#2563EB;animation:first-paint 1.1s ease-in-out infinite alternate}
      @keyframes first-paint{from{transform:translateX(-12px)}to{transform:translateX(68px)}}
      html.dark .app-first-paint{background:#0F141D;color:#F2F5F9}
      html.dark .app-first-paint__track{background:#273244}
      html.dark .app-first-paint__bar{background:#4C82F7}
      @media (prefers-color-scheme:dark){.app-first-paint{background:#0F141D;color:#F2F5F9}.app-first-paint__track{background:#273244}.app-first-paint__bar{background:#4C82F7}}
      @media (prefers-reduced-motion:reduce){.app-first-paint__bar{width:100%;animation:none;opacity:.7}}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-first-paint" role="status" aria-label="Đang mở CreativeHub">
        <div class="app-first-paint__brand">
          <img class="app-first-paint__logo" src="/logo.png" alt="" />
          <span class="app-first-paint__name">CreativeHub</span>
          <span class="app-first-paint__track" aria-hidden="true"><span class="app-first-paint__bar"></span></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
